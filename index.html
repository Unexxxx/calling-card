<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="css/styles.css">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0F4C6E">

<body>
  <main class="card" id="top">
    <header class="hero">
      <div class="hero__cover" role="img" aria-label="Tisha Travel and Tours brand cover"></div>
      <div class="hero__gradient" aria-hidden="true"></div>

    <div class="profile-wrap">
      <img
        class="profile__image"
        src="assets/icons/profile_image.png"
        alt="Kent Onyx S. Arintok"
        width="128"
        height="128"
      >

    <section class="content" aria-label="Profile and contact">

        <h1 class="identity__name">Kent Onyx S. Arintok</h1>
        <p class="identity__title">Travel Consultant</p>
        <p class="identity__org">Tisha Travel and Tours</p>
      </div>

      <nav class="actions" aria-label="Contact actions">
        <a

          href="contact.vcf"
          download="Kent-Onyx-Arintok.vcf"

        <a class="action action--email" href="mailto:kentonyx@gmail.com">
          <svg class="action__icon" width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z" fill="currentColor"/>

        <a
          class="action action--linkedin"
          href="https://www.linkedin.com/in/kent-onyx-arintok-310981234/"
          rel="noopener noreferrer"
          target="_blank"

          <svg class="action__icon" width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M19 3a2 2 0 012 2v14a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h14zm-11 6H5v10h3V9zm-1.5-3a1.75 1.75 0 110 3.5 1.75 1.75 0 010-3.5zM13 9H10v10h3v-5.3c0-1.5 1-2.7 2.3-2.7 1.3 0 1.7 1 1.7 2.5V19h3v-5.6C20 11 18.3 9 15.7 9 14.2 9 13.4 9.6 13 10.2V9z" fill="currentColor"/>
