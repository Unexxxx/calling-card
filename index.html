<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kent Onyx S. Arintok — Calling Card</title>
  <meta name="description" content="Calling card for Kent Onyx S. Arintok — email, phone, and LinkedIn.">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1A4352">
</head>
<body>
  <main class="page">
    <section class="hero" aria-label="Identity">
      <div class="hero__overlay" aria-hidden="true"></div>
      <div class="hero__inner">
        <img
          class="hero__portrait"
          src="assets/icons/profile_image.png"
          alt="Kent Onyx S. Arintok"
          width="120"
          height="120"
        >
        <div class="hero__content">
          <h1 class="hero__name">Kent Onyx S. Arintok</h1>
          <p class="hero__tagline">Tisha Travel and Tours</p>
        </div>
      </div>
    </section>

    <div class="hero-bridge" aria-hidden="true"></div>

    <section class="contact-panel" aria-label="Contact">
      <h2 class="visually-hidden">Contact</h2>

      <div class="contact-panel__summary" aria-label="Contact details">
        <p class="contact-summary__name">Kent Onyx S. Arintok</p>
        <p class="contact-summary__row">
          <span class="contact-summary__label">Email</span>
          <a href="mailto:kentonyx@gmail.com">kentonyx@gmail.com</a>
        </p>
        <p class="contact-summary__row">
          <span class="contact-summary__label">Phone</span>
          <a href="tel:+639276479058">+63 927 647 9058</a>
        </p>
      </div>

      <address class="contact-panel__address">
        <ul class="contact__list">
          <li>
            <a
              class="contact__link contact__link--vcard"
              href="contact.vcf"
              download="Kent-Onyx-Arintok.vcf"
            >Add to Contacts</a>
          </li>
          <li>
            <a class="contact__link contact__link--primary" href="mailto:kentonyx@gmail.com">Email</a>
          </li>
          <li>
            <a class="contact__link" href="tel:+639276479058">Phone</a>
          </li>
          <li>
            <a
              class="contact__link"
              href="https://www.linkedin.com/in/kent-onyx-arintok-310981234/"
              rel="noopener noreferrer"
            >LinkedIn</a>
          </li>
        </ul>
      </address>
    </section>
  </main>

  <script src="js/main.js" defer></script>
</body>
</html>
